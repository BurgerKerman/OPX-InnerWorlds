@Kopernicus:AFTER[OPX-InnerWorlds]:HAS[@OPX_InnerWorlds_Settings:HAS[#MinorPlanetNumbers[True]]]
{
    @Body[Vant]:NEEDS[MPE]
    {
        @Properties
        {
            %displayName = #LOC_OPX-IW_Vant_Name_Alt
        }
    }
    @Body[Zore]:NEEDS[MPE]
    {
        @Properties
        {
            %displayName = #LOC_OPX-IW_Zore_Name_Alt
        }
    }
}
@Kopernicus:AFTER[MPE]:HAS[@OPX_InnerWorlds_Settings:HAS[#MinorPlanetNumbers[False]]]
{
    @Body[Edas]
    {
        @Properties
        {
            %displayName = #LOC_OPX-IW_Edas_Name_Alt
        }
    }
}
